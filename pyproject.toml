[project]
name = "somnia"
version = "0.1.0"
description = "Shared memory service for coding agents (Supabase Postgres + pgvector)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "tiktoken>=0.14.0",
]

[project.scripts]
somnia-api = "somnia.api.serve:main"
somnia-worker = "somnia.worker.main:main"
somnia-admin = "somnia.admin.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.11", "ruff>=0.6", "somnia-agent"]

[tool.uv.sources]
somnia-agent = { path = "agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/somnia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a real Postgres with pgvector (SOMNIA_TEST_DATABASE_URL)"]
